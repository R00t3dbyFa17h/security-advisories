<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <style>
      .mono{font-family:"Hack","Fira Code","DejaVu Sans Mono",monospace;}
      .f{fill:#79c0ff;} .t{fill:#ff7b72;} .b{fill:#c9d1d9;} .mut{fill:#8b949e;}
      .title{font-family:"DejaVu Sans",Arial,sans-serif;font-weight:700;fill:#f0f6fc;}
    </style>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.8"><stop offset="0" stop-color="#1d3a5f" stop-opacity="0.55"/><stop offset="1" stop-color="#0b0e14" stop-opacity="0"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="1400" height="800" fill="#0b0e14"/>
  <ellipse cx="700" cy="-20" rx="820" ry="360" fill="url(#glow)"/>

  <text x="700" y="66" text-anchor="middle" class="title" font-size="38" letter-spacing="-0.5">A protected-value boundary, guarded everywhere but one path</text>
  <rect x="640" y="86" width="120" height="5" rx="2.5" fill="url(#acc)"/>
  <text x="700" y="128" text-anchor="middle" font-size="20" class="mut">Every data sink refuses to emit a Sensitive value. The ConditionGroup control-flow path never checked.</text>

  <!-- LEFT: sinks guarded -->
  <rect x="60" y="170" width="610" height="410" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="60" y="170" width="8" height="410" rx="4" fill="#3fb950"/>
  <text x="104" y="214" font-size="21" font-weight="700" fill="#e6edf3">Data sinks — sensitivity-checked</text>
  <rect x="500" y="190" width="130" height="30" rx="15" fill="#152a1b" stroke="#2ea043"/>
  <text x="565" y="211" text-anchor="middle" font-size="14" font-weight="700" fill="#3fb950">GUARDED</text>
  <g class="mono" font-size="18" fill="#c9d1d9">
    <text x="104" y="268">SendActivity</text><text x="104" y="304">HttpRequestAction</text>
    <text x="104" y="340">InvokeMcpTool</text><text x="104" y="376">InvokeFunctionTool</text>
    <text x="104" y="412">InvokeAzureAgent</text><text x="104" y="448">Question · AddConversationMessage</text>
  </g>
  <g font-size="18" fill="#3fb950">
    <text x="430" y="268">✓</text><text x="430" y="304">✓</text><text x="430" y="340">✓</text>
    <text x="430" y="376">✓</text><text x="430" y="412">✓</text><text x="430" y="448">✓</text>
  </g>
  <rect x="104" y="476" width="520" height="70" rx="8" fill="#0f1a12" stroke="#1f3d2b"/>
  <text x="124" y="508" class="mono" font-size="17" fill="#7ee787">GetNonSensitiveValue(value)  →  throws on Sensitive</text>
  <text x="124" y="532" font-size="15" class="mut">"Cannot send sensitive activity text" — the boundary holds.</text>

  <!-- RIGHT: conditiongroup unguarded -->
  <rect x="730" y="170" width="610" height="410" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="730" y="170" width="8" height="410" rx="4" fill="#f85149"/>
  <text x="774" y="214" font-size="21" font-weight="700" fill="#e6edf3">ConditionGroupExecutor</text>
  <rect x="1168" y="190" width="130" height="30" rx="15" fill="#2d1518" stroke="#f85149"/>
  <text x="1233" y="211" text-anchor="middle" font-size="14" font-weight="700" fill="#f85149">NO CHECK</text>
  <g class="mono" font-size="19">
    <text x="774" y="272"><tspan class="b">var r = Evaluator.</tspan><tspan class="f">GetValue</tspan><tspan class="b">(condition);</tspan></text>
    <text x="774" y="308"><tspan class="t">if</tspan><tspan class="b"> (r.Value) {   </tspan><tspan class="mut">// no sensitivity guard</tspan></text>
    <text x="806" y="344"><tspan class="b">Local.Leak = </tspan><tspan class="s" fill="#a5d6ff">"prefix_is_sk_live"</tspan><tspan class="b">;</tspan></text>
    <text x="774" y="380" class="b">}</text>
  </g>
  <rect x="790" y="398" width="500" height="34" rx="6" fill="#2d1518" stroke="#f85149" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="806" y="422" class="mono" font-size="18" fill="#f85149" font-style="italic">literal assigned in branch  →  Sensitivity = None</text>
  <text x="774" y="474" font-size="18" fill="#c9d1d9">The branch is <tspan font-weight="700" fill="#f0f6fc">selected by the secret</tspan>, but the value written</text>
  <text x="774" y="500" font-size="18" fill="#c9d1d9">is a plain literal — so the sink guard never fires.</text>
  <text x="774" y="540" font-size="19" fill="#f85149" font-weight="700">✗ Secret laundered through control flow (implicit flow)</text>

  <text x="700" y="648" text-anchor="middle" font-size="20" fill="#e6edf3">The sinks block the secret's <tspan font-weight="700">data flow</tspan>. Branching leaks it through <tspan font-weight="700" fill="#ff7b72">control flow</tspan> — the one path with no guard.</text>
  <text x="700" y="684" text-anchor="middle" font-size="16" class="mut">CWE-200 / CWE-203 · Information disclosure via sensitivity-boundary bypass · GHSA-4532-fhjf-wq2q</text>

  <line x1="60" y1="726" x2="1340" y2="726" stroke="#21262d" stroke-width="1.5"/>
  <g transform="translate(60,738)"><path d="M6 9 V6 a7 7 0 0 1 14 0 V9" fill="none" stroke="url(#acc)" stroke-width="3" stroke-linecap="round"/><rect x="2" y="9" width="22" height="18" rx="4" fill="url(#acc)"/><rect x="10.5" y="14" width="3" height="8" rx="1.5" fill="#0b0e14"/></g>
  <text x="96" y="762" font-size="22" font-weight="700" fill="#e6edf3">Nicholas Mullenski<tspan font-size="21" font-weight="400" fill="#8b949e">&#160;&#160;·&#160;&#160;R00t3dbyFa17h</tspan></text>
  <text x="1340" y="762" text-anchor="end" font-size="17" fill="#6e7681"><tspan fill="#22d3ee">GHSA-4532-fhjf-wq2q</tspan>&#160;&#160;·&#160;&#160;Microsoft Agent Framework → fixed 1.26.0</text>
</svg>
